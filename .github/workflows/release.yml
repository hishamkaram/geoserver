name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: read-all

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release needs this to publish
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: Verify build
        run: |
          go mod verify
          go vet ./...
          go test -race -short ./...

      - name: Extract release notes for ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          version="${tag#v}"
          awk -v version="$version" '
            $0 ~ "^## \\["version"\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No CHANGELOG stanza found for [$version] (tag $tag) in CHANGELOG.md; refusing to publish a release with empty body."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
